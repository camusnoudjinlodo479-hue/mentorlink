{% extends "base.html" %}
{% block title %}Connexion — MentorLink{% endblock %}

{% block public_content %}
<style>
* { box-sizing: border-box; }
.auth-page {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
  padding: 24px 16px;
  font-family: 'Space Grotesk', sans-serif;
}
.auth-card {
  width: 100%; max-width: 420px;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 20px;
  padding: 36px 32px;
  animation: fadeInUp .4s ease;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.auth-logo { text-align: center; margin-bottom: 28px; }
.auth-logo img { height: 50px; margin-bottom: 10px; }
.auth-logo h2 {
  font-family: 'Sora', sans-serif;
  font-size: 1.3rem; font-weight: 800; color: #e6edf3; margin-bottom: 4px;
}
.auth-logo p { color: #8b949e; font-size: .85rem; }
.form-group { margin-bottom: 16px; }
.form-label {
  display: block; font-size: .82rem; font-weight: 600;
  color: #8b949e; margin-bottom: 6px;
}
.form-label a { color: #f39c12; font-weight: 400; float: right; }
.input-wrap { position: relative; }
.form-control {
  width: 100%; background: #21262d;
  border: 1px solid #30363d; border-radius: 10px;
  padding: 11px 14px; color: #e6edf3;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px; transition: border-color .2s;
}
.form-control:focus { outline: none; border-color: #f39c12; }
.form-control::placeholder { color: #656d76; }
.toggle-pwd {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  color: #656d76; padding: 4px;
}
.toggle-pwd svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.remember-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 20px; font-size: .85rem; color: #8b949e;
}
.remember-row input { accent-color: #f39c12; width: 16px; height: 16px; cursor: pointer; }
.remember-row label { cursor: pointer; }
.btn-submit {
  width: 100%; padding: 12px;
  background: #f39c12; color: white;
  border: none; border-radius: 10px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700; font-size: .95rem;
  cursor: pointer; transition: all .2s;
  position: relative; overflow: hidden;
}
.btn-submit::before {
  content: '';
  position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
  transition: left .4s;
}
.btn-submit:hover::before { left: 100%; }
.btn-submit:hover { background: #d68910; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(243,156,18,.4); }
.auth-footer {
  text-align: center; margin-top: 20px;
  font-size: .85rem; color: #8b949e;
}
.auth-footer a { color: #f39c12; font-weight: 600; text-decoration: none; }
.auth-footer a:hover { text-decoration: underline; }
.divider {
  display: flex; align-items: center; gap: 12px;
  margin: 20px 0; color: #656d76; font-size: .8rem;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: #30363d;
}
</style>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="MentorLink">
      <h2>Connexion</h2>
      <p>Accede a ton espace MentorLink</p>
    </div>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">
          Email ou telephone
        </label>
        <input type="text" name="identifier" class="form-control"
               placeholder="email@example.com ou +229..."
               required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label">
          Mot de passe
          <a href="{{ url_for('auth.reset_password') }}">Mot de passe oublie ?</a>
        </label>
        <div class="input-wrap">
          <input type="password" name="password" id="password"
                 class="form-control" placeholder="••••••••"
                 required autocomplete="current-password">
          <button type="button" class="toggle-pwd" onclick="togglePwd('password', this)">
            <svg viewBox="0 0 24 24" id="eye-icon">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="remember-row">
        <input type="checkbox" name="remember" id="remember">
        <label for="remember">Se souvenir de moi</label>
      </div>

      <button type="submit" class="btn-submit">Se connecter</button>
    </form>

    <div class="divider">ou</div>

    <div class="auth-footer">
      Pas encore de compte ?
      <a href="{{ url_for('auth.register') }}">S'inscrire gratuitement</a>
    </div>
  </div>
</div>

<script>
function togglePwd(id, btn) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
  btn.style.color = el.type === 'text' ? '#f39c12' : '#656d76';
}
</script>
{% endblock %}
