{% extends "base.html" %}
{% block title %}Reinitialisation du mot de passe — MentorLink{% endblock %}

{% block public_content %}
<style>
.auth-page { min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 30%,rgba(0,184,148,.1) 0%,transparent 70%),var(--dark);padding:20px; }
.auth-card { width:100%;max-width:420px;background:var(--dark-2);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:40px; }
</style>
<div class="auth-page">
  <div class="auth-card">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="font-size:2.2rem;"></div>
      <h2 style="font-family:'Sora',sans-serif;font-size:1.4rem;font-weight:800;margin-top:8px;">Reinitialiser le mot de passe</h2>
      <p style="color:var(--text-secondary);font-size:.875rem;margin-top:4px;">Entrez vos informations pour verifier votre identite</p>
    </div>
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Adresse e-mail</label>
        <input type="email" name="email" class="form-control" placeholder="votre@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Numero de telephone</label>
        <input type="tel" name="phone" class="form-control" placeholder="+229..." required>
      </div>
      <div class="form-group">
        <label class="form-label">Nouveau mot de passe</label>
        <input type="password" name="new_password" class="form-control" placeholder="••••••••" required minlength="8">
      </div>
      <div class="form-group">
        <label class="form-label">Confirmer le mot de passe</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Reinitialiser</button>
    </form>
    <div style="text-align:center;margin-top:16px;font-size:.85rem;">
      <a href="{{ url_for('auth.login') }}">← Retour a la connexion</a>
    </div>
  </div>
</div>
{% endblock %}
